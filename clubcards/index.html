<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clubコミュ症 カード一覧</title>
<style>body{font-family:system-ui,sans-serif;background:#11151e;color:#edf0f7;margin:auto;padding:32px;max-width:1250px}h1{font-size:26px}p{line-height:1.7;color:#b8c6da}input,button{font:inherit;padding:8px;border-radius:6px}#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;margin-top:24px}article{background:#202838;padding:16px;border-radius:12px}img{width:100%;height:230px;object-fit:contain}h2{font-size:17px;overflow-wrap:anywhere}small{display:block;margin:8px 0;color:#c2cfdf}a{color:#94c8ff}article input{width:100%;box-sizing:border-box;margin-top:8px}button{cursor:pointer}</style>
<h1>Clubコミュ症 カード一覧</h1><p>カード番号の末尾からレアリティを決め、レアリティ別の標準排出ウェイトを使います。変更したカードだけ個別設定を優先します。</p><input id="search" type="search" placeholder="カード番号・カード名で検索" aria-label="カード検索"><p id="status" role="status">読込中…</p><main id="cards"></main><p><a href="../data/clubcard_manifest.json">カードマニフェスト</a> · <a href="../ebk-room-media/">スライド一覧</a></p>
<script>
(async()=>{'use strict';const host=document.getElementById('cards'),status=document.getElementById('status'),search=document.getElementById('search');const node=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e};try{const response=await fetch('../data/clubcard_manifest.json',{cache:'no-store'});if(!response.ok)throw Error('読込失敗');const data=await response.json();const render=()=>{host.replaceChildren();const selected=data.cards.filter(c=>(c.cardNumber+' '+c.cardName).includes(search.value.trim()));status.textContent=selected.length+' / '+data.cards.length+'枚';for(const c of selected){const rarity=c.manualRarityWeightOverride?c.rarityOverride:data.rarityRules.byLastDigit[c.cardNumber.slice(-1)];const weight=c.manualRarityWeightOverride?c.weightOverride:data.rarityRules.defaultWeights[rarity];const tile=node('article'),image=node('img');image.src='../'+c.imagePath;image.alt=c.cardName;image.loading='lazy';const input=node('input');input.type='text';input.readOnly=true;input.value=new URL('../'+c.imagePath,location.href).href;input.setAttribute('aria-label',c.cardNumber+'の画像URL');const copy=node('button','画像URLをコピー');copy.onclick=async()=>{try{await navigator.clipboard.writeText(input.value);status.textContent=c.cardNumber+' の画像URLをコピーしました'}catch(_){input.focus();input.select();status.textContent='URLを選択しました。コピーしてください'}};tile.append(image,node('h2',c.cardNumber+' '+c.cardName),node('small',rarity+' / 排出ウェイト '+weight+' / '+(c.manualRarityWeightOverride?'個別設定':'自動')),input,copy);host.append(tile)}};search.oninput=render;render()}catch(e){status.textContent='カードを読み込めませんでした。再読み込みしてください。'}})();
</script></html>
