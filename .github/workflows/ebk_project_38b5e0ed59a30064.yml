name: Build isolated EBK media (docs/EBK/projects/prj_38b5e0ed59a30064e8c97d17555ab3e6)
on:
  push:
    branches: ["main"]
    paths:
      - "docs/EBK/projects/prj_38b5e0ed59a30064e8c97d17555ab3e6/data/**"
      - "docs/EBK/projects/prj_38b5e0ed59a30064e8c97d17555ab3e6/images/**"
      - "docs/EBK/projects/prj_38b5e0ed59a30064e8c97d17555ab3e6/media/**"
      - "docs/EBK/projects/prj_38b5e0ed59a30064e8c97d17555ab3e6/themes/**"
      - "docs/EBK/projects/prj_38b5e0ed59a30064e8c97d17555ab3e6/tools/**"
      - ".github/workflows/ebk_media_38b5e0ed59a30064.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ebk-media-38b5e0ed59a30064-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.save.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "main"
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install encoders
        run: |
          python -m pip install pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Build only the selected folder
        run: python "docs/EBK/projects/prj_38b5e0ed59a30064e8c97d17555ab3e6/tools/build_media_root.py" --root "docs/EBK/projects/prj_38b5e0ed59a30064e8c97d17555ab3e6"
      - name: Refresh fixed venue projections using this project
        shell: bash
        env:
          EBK_MEDIA_ROOT: "docs/EBK/projects/prj_38b5e0ed59a30064e8c97d17555ab3e6"
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os, shutil
          root=os.environ['EBK_MEDIA_ROOT'].strip('/')
          source=Path(root)/'common/manifest.json'
          if not source.is_file():
              source=Path(root)/'data/roster_manifest.json'
          venues=Path('docs/EBK/venues')
          if source.is_file() and venues.is_dir():
              for active in venues.glob('*/data/active_project.json'):
                  try:
                      meta=json.loads(active.read_text(encoding='utf-8-sig'))
                  except Exception:
                      continue
                  if str(meta.get('projectRoot','')).strip('/') != root:
                      continue
                  target=active.parent/'roster_manifest.json'
                  target.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(source,target)
                  print('updated venue projection:',target)
          PY
      - name: Commit generated files with input freshness check
        id: save
        env:
          EBK_BRANCH: "main"
          EBK_MEDIA_ROOT: "docs/EBK/projects/prj_38b5e0ed59a30064e8c97d17555ab3e6"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base_sha="$(git rev-parse HEAD)"
          git add -- "$EBK_MEDIA_ROOT/ebk_media_root.json" "$EBK_MEDIA_ROOT/themes/theme_catalog.json"
          if [ -d docs/EBK/venues ]; then git add -- docs/EBK/venues; fi
          for group in common ebk-clubcards ebk-room-media; do
            if [ -d "$EBK_MEDIA_ROOT/$group" ]; then git add -- "$EBK_MEDIA_ROOT/$group"; fi
          done
          if ! git diff --cached --quiet; then git commit -m "build: isolated EBK media docs/EBK/projects/prj_38b5e0ed59a30064e8c97d17555ab3e6"; fi
          for attempt in 1 2 3; do
            git fetch origin "$EBK_BRANCH"
            if ! git diff --quiet "$base_sha" "origin/$EBK_BRANCH" -- "$EBK_MEDIA_ROOT/data" "$EBK_MEDIA_ROOT/images" "$EBK_MEDIA_ROOT/media" "$EBK_MEDIA_ROOT/themes" "$EBK_MEDIA_ROOT/tools" ".github/workflows/ebk_media_38b5e0ed59a30064.yml"; then
              echo "New input detected; a newer build will publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase "origin/$EBK_BRANCH"
            if git push origin "HEAD:$EBK_BRANCH"; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          exit 1
  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      # Refresh after acquiring the Pages lock so the legacy site is included.
      - uses: actions/checkout@v4
        with:
          ref: "main"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: publish
