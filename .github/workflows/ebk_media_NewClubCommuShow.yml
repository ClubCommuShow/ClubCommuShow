name: Build isolated EBK media (NewClubCommuShow)
on:
  push:
    branches: ["main"]
    paths:
      - "NewClubCommuShow/data/**"
      - "NewClubCommuShow/images/**"
      - "NewClubCommuShow/media/**"
      - "NewClubCommuShow/themes/**"
      - "NewClubCommuShow/tools/**"
      - ".github/workflows/ebk_media_NewClubCommuShow.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ebk-media-NewClubCommuShow-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.save.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "main"
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install encoders
        run: |
          python -m pip install pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Build only the selected folder
        run: python "NewClubCommuShow/tools/build_media_root.py" --root "NewClubCommuShow"
      - name: Commit generated files with input freshness check
        id: save
        env:
          EBK_BRANCH: "main"
          EBK_MEDIA_ROOT: "NewClubCommuShow"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base_sha="$(git rev-parse HEAD)"
          git add -- "$EBK_MEDIA_ROOT/ebk_media_root.json" "$EBK_MEDIA_ROOT/themes/theme_catalog.json"
          for group in common ebk-clubcards ebk-room-media; do
            if [ -d "$EBK_MEDIA_ROOT/$group" ]; then git add -- "$EBK_MEDIA_ROOT/$group"; fi
          done
          if ! git diff --cached --quiet; then git commit -m "build: isolated EBK media NewClubCommuShow"; fi
          for attempt in 1 2 3; do
            git fetch origin "$EBK_BRANCH"
            if ! git diff --quiet "$base_sha" "origin/$EBK_BRANCH" -- "$EBK_MEDIA_ROOT/data" "$EBK_MEDIA_ROOT/images" "$EBK_MEDIA_ROOT/media" "$EBK_MEDIA_ROOT/themes" "$EBK_MEDIA_ROOT/tools" ".github/workflows/ebk_media_NewClubCommuShow.yml"; then
              echo "New input detected; a newer build will publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase "origin/$EBK_BRANCH"
            if git push origin "HEAD:$EBK_BRANCH"; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          exit 1
  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      # Refresh after acquiring the Pages lock so the legacy site is included.
      - uses: actions/checkout@v4
        with:
          ref: "main"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: publish
