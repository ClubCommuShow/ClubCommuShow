name: Publish isolated EBK Wizard samples
on:
  push:
    branches: [main]
    paths: ['tests/ebk-videoroster/wizard-*/**', '.github/workflows/ebk-wizard-samples.yml']
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish existing site plus new samples without rebuilding live media
        id: deploy
        uses: actions/deploy-pages@v4
