name: Build EBK roster and slide albums

on:
  push:
    branches:
      - main
    paths:
      - 'data/roster_manifest.json'
      - 'images/**'
      - 'media/room-slides/**'
      - 'data/room_media_slides.json'
      - 'data/clubcard_manifest.json'
      - 'build_room_media_slides.py'
      - 'validate_clubcards.py'
      - 'publish_room_media.py'
      - 'clubcards/**'
      - 'github_manifest_to_video.py'
      - 'prepare_video_roster_manifest.py'
      - '.github/workflows/auto_build_roster_video.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: roster-video-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-video:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build dynamic VideoRoster manifest
        run: |
          python prepare_video_roster_manifest.py \
            --manifest "data/roster_manifest.json" \
            --menu-dir "images/posters/menu" \
            --allow-gaps \
            --output "data/roster_manifest.video.generated.json"

      - name: Build 3-frame-center mp4 and frame map
        run: |
          mkdir -p videos data docs/videos docs/data
          python github_manifest_to_video.py \
            --repo-url "https://github.com/${{ github.repository }}/" \
            --manifest-url "file://${{ github.workspace }}/data/roster_manifest.video.generated.json" \
            --output "videos/roster.mp4" \
            --frame-map-output "data/roster_frame_map.txt" \
            --save-url-list "data/roster_resolved_urls.txt" \
            --include-posters \
            --include-portraits \
            --fps 30 \
            --frames-per-entry 3 \
            --sample-frame 1 \
            --resize-mode stretch \
            --crf 16 \
            --gop 1

          cp data/roster_manifest.json docs/data/roster_manifest.json
          cp data/roster_frame_map.txt docs/data/roster_frame_map.txt
          cp data/roster_resolved_urls.txt docs/data/roster_resolved_urls.txt
          cp videos/roster.mp4 docs/videos/roster.mp4

      - name: Validate ClubCard and build slide albums
        run: |
          python validate_clubcards.py
          python build_room_media_slides.py
          python publish_room_media.py

      - name: Commit generated files without overwriting concurrent changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos/roster.mp4 data/roster_frame_map.txt data/roster_resolved_urls.txt docs/videos docs/data docs/ebk-room-media ebk-room-media
          if ! git diff --cached --quiet; then
            git commit -m "chore: rebuild roster and slide albums"
            git push origin HEAD:main
          fi

      - name: Upload the existing root Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build-video
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
