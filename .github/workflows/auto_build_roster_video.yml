name: Build roster video

on:
  push:
    branches:
      - main
    paths:
      - 'data/roster_manifest.json'
      - 'images/**'
      - 'github_manifest_to_video.py'
      - 'github_manifest_to_video_nocrop.py'
      - 'github_manifest_to_video_nocrop_pillow.py'
      - '.github/workflows/auto_build_roster_video.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-video:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Copy manifest for Pages
        run: |
          mkdir -p docs/data
          cp data/roster_manifest.json docs/data/roster_manifest.json

      - name: Build mp4 from roster manifest
        run: |
          mkdir -p docs/videos
          SCRIPT="github_manifest_to_video.py"
          if [ -f "github_manifest_to_video_nocrop_pillow.py" ]; then
            SCRIPT="github_manifest_to_video_nocrop_pillow.py"
          elif [ -f "github_manifest_to_video_nocrop.py" ]; then
            SCRIPT="github_manifest_to_video_nocrop.py"
          fi
          python "$SCRIPT"             --repo-url "https://github.com/${{ github.repository }}/"             --manifest-url "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/data/roster_manifest.json"             --output "docs/videos/roster.mp4"             --save-url-list "docs/data/roster_resolved_urls.txt"             --include-posters             --include-portraits             --fps 30             --crf 10             --gop 1

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/videos/roster.mp4 docs/data/roster_manifest.json docs/data/roster_resolved_urls.txt

          if git diff --cached --quiet; then
            echo "No changes in generated files"
            exit 0
          fi

          git commit -m "chore: rebuild roster video publish manifest and resolved urls"
          git push
